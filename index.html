<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Growth Analytics</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E📊%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.82.0/build/stlite.css"
      crossorigin="anonymous"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #root {
        min-height: 100%;
      }
      #err {
        display: none;
        font-family: system-ui, sans-serif;
        padding: 1.5rem;
        max-width: 40rem;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <pre id="err"></pre>
    <div id="root"></div>
    <script type="module">
      const errEl = document.getElementById("err");
      function showErr(msg) {
        errEl.style.display = "block";
        errEl.textContent = msg;
      }

      try {
        const { mount } =
          await import("https://cdn.jsdelivr.net/npm/@stlite/browser@0.82.0/build/stlite.js");

        const appRes = await fetch("/app.py", { cache: "no-cache" });
        if (!appRes.ok) {
          showErr(
            "Could not load /app.py (" +
              appRes.status +
              "). Check that app.py is deployed at the site root on Vercel.",
          );
          throw new Error("app.py " + appRes.status);
        }

        const cssRes = await fetch("/app_styles.css", { cache: "no-cache" });
        if (!cssRes.ok) {
          showErr(
            "Could not load /app_styles.css (" +
              cssRes.status +
              "). Check that the file exists on the deployment.",
          );
          throw new Error("css " + cssRes.status);
        }

        const appPy = await appRes.text();
        const app_styles_css = await cssRes.text();

        mount(
          {
            entrypoint: "app.py",
            files: {
              "app.py": appPy,
              "app_styles.css": app_styles_css,
            },
            requirements: ["pandas", "numpy", "openpyxl", "plotly", "xlrd"],
          },
          document.getElementById("root"),
        );
      } catch (e) {
        if (!errEl.textContent) {
          showErr(String(e && e.message ? e.message : e));
        }
        console.error(e);
      }
    </script>
  </body>
</html>
